<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <nav class="bg-white shadow px-6 py-3 flex justify-between items-center">
    <a href="index.html"><h1 class="text-xl font-bold text-blue-600 italic">Flipkart</h1></a>
    <a href="index.html" class="text-sm text-blue-600 font-medium">← Back to Home</a>
  </nav>

  <section class="max-w-4xl mx-auto mt-8 bg-white p-6 rounded shadow">

    <h2 class="text-xl font-bold mb-4">Your Cart</h2>

    <div id="cart-items" class="space-y-4"></div>

    <div class="mt-6 text-right">

  <script src="cart.js"></script>

</html>
